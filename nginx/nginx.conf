# Nginx: единая точка входа с IP whitelist.
# Генерация allow_ips.conf: build.py generate-nginx-whitelist (или при up/rebuild).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Upstreams (внутренние сервисы по именам Docker)
    upstream api_gateway {
        server api-gateway:8000;
    }
    upstream web_ui {
        server web-ui:8000;
    }
    upstream web_bff {
        server web-bff:8000;
    }
    upstream grafana_backend {
        server grafana:3000;
    }
    upstream qdrant_backend {
        server qdrant:6333;
    }
    upstream rabbitmq_management {
        server rabbitmq:15672;
    }
    upstream prometheus_backend {
        server prometheus:9090;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # IP whitelist: сгенерированный файл (build.py generate-nginx-whitelist)
        include /etc/nginx/conf.d/allow_ips.conf;

        # API Gateway — основное приложение (REST API)
        location / {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Grafana UI
        location /grafana/ {
            proxy_pass http://grafana_backend/grafana/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Qdrant Web UI / API (dashboard и REST)
        location /qdrant/ {
            proxy_pass http://qdrant_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Prefix /qdrant;
        }

        # RabbitMQ Management UI
        location /rabbitmq/ {
            proxy_pass http://rabbitmq_management/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Prefix /rabbitmq;
            proxy_buffering off;
        }

        # Prometheus (метрики)
        location /prometheus/ {
            proxy_pass http://prometheus_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # Web UI HTTP (public; no IP whitelist — must match Host below)
    server {
        listen 80;
        listen [::]:80;
        server_name
            candidate-ui.ferus.tech
            candidate-ui.ferus.tech.;

        # Web BFF under same origin (no CORS in browser)
        location /bff/ {
            proxy_pass http://web_bff/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Web UI (static FastAPI)
        location / {
            proxy_pass http://web_ui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # Web UI HTTPS (TLS)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name
            candidate-ui.ferus.tech
            candidate-ui.ferus.tech.;

        # Mounted from ./nginx/certs on host:
        # - ./nginx/certs/fullchain.pem
        # - ./nginx/certs/privkey.pem
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location /bff/ {
            proxy_pass http://web_bff/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://web_ui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
