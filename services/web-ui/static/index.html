<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Кандидат — Web UI (MVP)</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="icon" type="image/png" href="/static/brand.png" />
    <link rel="apple-touch-icon" href="/static/brand.png" />
  </head>
  <body>
    <canvas id="bg" class="bg"></canvas>
    <div class="wrap">
      <header class="header">
        <div class="brand">
          <img class="brandIcon" src="/static/brand.png" alt="Кандидат" />
          <div class="title">Кандидат</div>
        </div>
        <div class="links">
          <a href="https://candidate.ferus.tech/" target="_blank" rel="noopener noreferrer">Сайт</a>
          <a href="https://t.me/gdekandidat" target="_blank" rel="noopener noreferrer">Чат проекта</a>
        </div>
        <div class="meta">
          <span id="sessionState" class="pill">session: ?</span>
          <button id="btnStart" class="btn">Start session</button>
        </div>
      </header>

      <main class="grid">
        <section class="card topCard">
          <h2>Резюме</h2>
          <div class="resumeLamps" id="resumeLamps" aria-label="Статус загрузки резюме">
            <span class="rlamp red active" data-rstep="1"></span>
            <span class="rlamp yellow" data-rstep="2"></span>
            <span class="rlamp green" data-rstep="3"></span>
          </div>
          <div class="row">
            <input id="resumeFile" type="file" />
            <button id="btnUpload" class="btn primary">Upload</button>
          </div>
          <div class="row">
            <textarea id="rawResume" class="textarea" rows="6" placeholder="Или вставьте резюме (raw) для /resume/convert"></textarea>
          </div>
          <div class="row">
            <button id="btnConvertRaw" class="btn">Convert raw</button>
          </div>
          <div id="resumeLoader" class="inlineLoader hidden"></div>
          <div class="row">
            <textarea id="structuredResume" class="textarea" rows="8" placeholder="structured_text (результат convert)"></textarea>
          </div>
        </section>

        <section class="card topCard">
          <h2>Вакансия</h2>
          <textarea id="vacancyText" class="textarea" rows="10" placeholder="Вставьте описание вакансии"></textarea>
          <div class="row">
            <button id="btnMatch" class="btn primary">Match</button>
            <button id="btnLetter" class="btn">Cover letter</button>
          </div>
          <div id="vacancyLoader" class="inlineLoader hidden"></div>
          <textarea id="vacancyOut" class="outText" rows="12" readonly placeholder="Здесь появится прокручиваемый результат match / cover-letter"></textarea>
        </section>

        <section class="card chat">
          <h2>Чат по резюме</h2>
          <div id="chatLog" class="chatlog"></div>
          <div class="row">
            <input id="chatInput" class="input" placeholder="Спросите про резюме…" />
            <button id="btnSend" class="btn primary">Send</button>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="hint">
          BFF URL:
          <input id="bffUrl" class="input small" />
        </div>
        <div class="hint">
          <a href="https://ferus.tech/pdn/" target="_blank" rel="noopener noreferrer">Согласие на обработку персональных данных</a>
        </div>
      </footer>
    </div>

    <script src="/static/neural.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
