[pytest]
# Pytest configuration for wulf_grinder_arch project
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests services/ingestion-service/tests services/telegram-bot/tests

# Minimum version
minversion = 6.0

# Output options
addopts = 
    -ra
    --strict-markers
    --strict-config
    --showlocals

# Markers for categorizing tests
markers =
    asyncio: marks tests as async (using pytest-asyncio)
    e2e: marks tests as end-to-end integration tests
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: marks tests as unit tests
    integration: marks tests as integration tests

# Asyncio: one loop for session so fixtures and tests share the same loop (asyncpg pool)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Log settings
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (optional, requires pytest-timeout)
# timeout = 300

# Coverage (optional, requires pytest-cov)
# addopts = --cov=services --cov-report=html --cov-report=term
